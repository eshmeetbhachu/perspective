# Opens pull requests when dependencies have updates or security fixes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all minor and patch updates, instead of dozens.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's type definitions follow the Node version we run (22, .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 LTS; moving to the next LTS is a deliberate change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
