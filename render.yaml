# Render Blueprint for the API on the free plan. Secrets are typed into the
# Render dashboard when the Blueprint is created (sync: false), never here.
services:
  - type: web
    name: perspective-api
    runtime: docker
    plan: free
    # Can't be changed later; keep it in the same region as the database.
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Liveness only, so a sleeping database doesn't fail the check.
    healthCheckPath: /health
    # Deploy only commits that passed CI.
    autoDeployTrigger: checksPass
    envVars:
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: ORIGIN_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
