# Local development services. Start with `docker compose up -d`.
# `docker compose --profile app up -d --build` also runs the production
# images (API, web, and a fake inbox) at http://localhost:4173.
name: perspective

services:
  postgres:
    image: postgres:18-alpine
    # pg_stat_statements records time spent per query (Phase 9 analysis).
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      # The built-in superuser. Only for us (admin tasks), never for the app.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set it in .env}
      POSTGRES_DB: perspective
      # Read by the init script to create the two app roles (Decision D19).
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set it in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set it in .env}
    ports:
      # 127.0.0.1 = reachable only from this machine, not from your network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Database files live in a named volume, so they survive container restarts.
      - pgdata:/var/lib/postgresql
      # Scripts in this folder run once, when the database is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perspective"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Response cache (Phase 9). Bounded memory; only keys with an expiry are
  # evicted, so the cache's version counters are never lost.
  redis:
    image: redis:8.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://perspective_app:${APP_PASSWORD}@postgres:5432/perspective
      MIGRATION_DATABASE_URL: postgres://perspective_migrator:${MIGRATOR_PASSWORD}@postgres:5432/perspective
      WEB_ORIGIN: http://localhost:4173
      # Requests reach the API through the web container, on Docker's
      # private network.
      TRUST_PROXY: uniquelocal
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Perspective <no-reply@perspective.local>
      REDIS_URL: redis://redis:6379

  # Sends the emails the API queues (same image, different entry point).
  worker:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://perspective_app:${APP_PASSWORD}@postgres:5432/perspective
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Perspective <no-reply@perspective.local>
      REDIS_URL: redis://redis:6379

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports:
      - "127.0.0.1:4173:8080"

  # Catches every email the API sends; read them at http://localhost:8025.
  mailpit:
    profiles: [app]
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"

  # --- Load testing (Phase 9): `docker compose --profile load ...` ---------

  # The production API image on a small, fixed budget (like one cheap cloud
  # instance), so results are repeatable and bottlenecks show early.
  api-load:
    profiles: [load]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    cpus: 1
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://perspective_app:${APP_PASSWORD}@postgres:5432/perspective_load
      MIGRATION_DATABASE_URL: postgres://perspective_migrator:${MIGRATOR_PASSWORD}@postgres:5432/perspective_load
      WEB_ORIGIN: http://load.test
      # k6 runs on Docker's private network and tells the API, via
      # X-Forwarded-For, which simulated visitor each request is from.
      TRUST_PROXY: uniquelocal
      SMTP_URL: smtp://mailpit:1025
      REDIS_URL: redis://redis:6379

  # Spreads requests over the api-load replicas
  # (`docker compose --profile load up -d --scale api-load=4`).
  lb-load:
    profiles: [load]
    image: nginx:1.29-alpine
    depends_on: [api-load]
    volumes:
      - ./load/nginx.conf:/etc/nginx/nginx.conf:ro

  k6:
    profiles: [load]
    image: grafana/k6:1.0.0
    volumes:
      - ./load:/load

volumes:
  pgdata:
