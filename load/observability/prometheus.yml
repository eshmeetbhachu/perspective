# Scrapes every api-load replica (Phase 9). Docker's DNS returns one address
# per replica, so scaling up needs no change here.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: [api-load]
        type: A
        port: 9464
        refresh_interval: 10s
