# Load balancer for the load-test API instances (Phase 9).
# One worker per CPU core. Thousands of simulated visitors each hold a few
# connections, so the default limits run out long before the API does.
worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 50000;
}

http {
  access_log off;

  upstream api {
    # Each request goes to the instance with the fewest open requests.
    least_conn;
    # Docker's DNS returns one address per api-load replica; nginx uses all
    # of them. Start the replicas before the load balancer.
    server api-load:3000;
    keepalive 256;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
